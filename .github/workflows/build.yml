name: Build YMT Client

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Android APK
        run: |
          cd flutter
          flutter create --platforms android .
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties 2>/dev/null || true
          # Inject custom VpnService code
          mkdir -p android/app/src/main/kotlin/com/ymt/app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ymt-android-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go client
        run: |
          cd cmd/client
          go mod tidy
          go build -o ../../ymt-client.exe .

      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: ymt-client-windows
          path: ymt-client.exe